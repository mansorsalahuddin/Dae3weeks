<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quran Recitation Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Quran Recitation Trainer</h1>
    </header>

    <main>
        <div class="ayah-box">
            <h2>Current Ayah</h2>
            <p id="ayahText">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
            </p>
        </div>

        <div class="controls">
            <button id="recordBtn">🎤 Record</button>
            <button id="stopBtn" disabled>⏹ Stop</button>
        </div>

        <div class="status">
            <p id="feedback">Waiting...</p>
        </div>

        <canvas id="visualizer"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
